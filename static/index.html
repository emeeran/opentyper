<div id="offline-banner" hidden role="status">Offline — reconnecting…</div>

<div id="app">
  <aside id="sidebar" class="closed">
    <div class="side-head">
      <span class="brand">OpenTyper</span>
      <button id="btn-side-close" class="icon-btn only-mobile" title="Close" aria-label="Close sidebar"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <button id="btn-new-chat" class="primary"><svg class="icon"><use href="#i-plus"/></svg><span>New chat</span></button>
    <button id="btn-search" class="ghost"><svg class="icon"><use href="#i-search"/></svg><span>Search</span><kbd>⌘K</kbd></button>
    <label id="archived-toggle" class="hint"><input type="checkbox" id="show-archived" style="flex:0"> Show archived</label>
    <nav id="chat-nav" aria-label="Chats"></nav>
    <div class="side-foot">
      <button id="btn-prompts" class="ghost"><svg class="icon"><use href="#i-spark"/></svg><span>Prompts</span></button>
      <button id="btn-agents" class="ghost"><svg class="icon"><use href="#i-bot"/></svg><span>Agents</span></button>
      <button id="btn-docs" class="ghost"><svg class="icon"><use href="#i-book"/></svg><span>Documents</span></button>
      <button id="btn-memory" class="ghost"><svg class="icon"><use href="#i-bookmark"/></svg><span>Memory</span></button>
      <button id="btn-usage" class="ghost"><svg class="icon"><use href="#i-grid"/></svg><span>Usage</span></button>
      <button id="btn-theme" class="ghost" title="Cycle theme: system → light → dark"><svg class="icon"><use href="#i-monitor"/></svg><span>Theme: system</span></button>
      <button id="btn-settings" class="ghost"><svg class="icon"><use href="#i-gear"/></svg><span>Settings</span></button>
    </div>
  </aside>

  <main id="main">
    <header id="chat-header">
      <button id="btn-side-toggle" class="icon-btn" title="Toggle sidebar (⌘B)" aria-label="Toggle sidebar"><svg class="icon"><use href="#i-menu"/></svg></button>
      <input id="chat-title" placeholder="New chat" title="Click to rename" aria-label="Chat title">
      <select id="model-select" title="Model" aria-label="Model"></select>
      <button id="btn-params" class="icon-btn" title="Chat settings" aria-label="Chat settings"><svg class="icon"><use href="#i-gear"/></svg></button>
      <button id="btn-fork" class="icon-btn" title="Fork chat (copy to a new chat)" aria-label="Fork chat"><svg class="icon"><use href="#i-branch"/></svg></button>
      <button id="btn-regen" class="icon-btn" title="Regenerate (⌘⌥E)" aria-label="Regenerate"><svg class="icon"><use href="#i-refresh"/></svg></button>
      <button id="btn-finalize" class="icon-btn" title="Synthesize multi-model replies into one answer" aria-label="Finalize replies" hidden><svg class="icon"><use href="#i-spark"/></svg></button>
      <button id="btn-artifacts" class="icon-btn" title="Artifacts of this chat" aria-label="Artifacts" hidden><svg class="icon"><use href="#i-code"/></svg></button>
      <button id="btn-del-chat" class="icon-btn" title="Delete chat" aria-label="Delete chat"><svg class="icon"><use href="#i-trash"/></svg></button>
    </header>

    <div id="messages"></div>
    <button id="scroll-bottom" class="fab" hidden title="Scroll to bottom" aria-label="Scroll to bottom"><svg class="icon"><use href="#i-chevron-down"/></svg></button>

    <div id="params-pop" hidden role="dialog" aria-label="Chat settings">
      <label>Temperature <input id="p-temp" type="number" step="0.1" min="0" max="2"></label>
      <label>Max tokens <input id="p-maxtok" type="number" min="1"></label>
      <label>Top P <input id="p-topp" type="number" step="0.05" min="0" max="1"></label>
      <label>Context limit (messages, 0 = all) <input id="p-context" type="number" min="0"></label>
      <label>Frequency penalty <input id="p-freq" type="number" step="0.1" min="-2" max="2"></label>
      <label>Presence penalty <input id="p-pres" type="number" step="0.1" min="-2" max="2"></label>
      <label>Reasoning effort
        <select id="p-effort">
          <option value="">Model default</option><option value="none">Off</option>
          <option value="low">Low</option><option value="medium">Medium</option>
          <option value="high">High</option><option value="xhigh">Extra high</option>
          <option value="max">Max</option>
        </select></label>
      <label>Output language <input id="p-lang" placeholder="e.g. Spanish (optional)"></label>
      <label class="checkrow"><input id="p-stream" type="checkbox" style="flex:0"> Stream responses</label>
      <label class="checkrow"><input id="p-knowledge" type="checkbox" style="flex:0"> Use documents (knowledge)</label>
      <label class="checkrow"><input id="p-cache" type="checkbox" style="flex:0"> Prompt caching (Anthropic)</label>
      <label class="checkrow"><input id="p-tempchat" type="checkbox" style="flex:0"> Temporary chat (not saved)</label>
      <label>Tags (comma-sep) <input id="p-tags" placeholder="work, ideas"></label>
      <label>Extra models (provider:model, …)
        <input id="p-extras" placeholder="openai:gpt-4o-mini, google:gemini-2.5-flash"></label>
      <label>System prompt <textarea id="p-sys" rows="4"></textarea></label>
      <label>Folder <select id="p-folder"></select></label>
      <div class="poprow">
        <button id="p-save" class="primary">Save</button>
        <button id="p-archive">Archive</button>
        <button id="p-pin">Pin</button>
        <button id="p-share">Share link</button>
      </div>
    </div>

    <footer id="composer">
      <div id="tts-bar" hidden>
        <button id="tts-play" class="icon-btn" title="Play / pause" aria-label="Play or pause"><svg class="icon"><use href="#i-pause"/></svg></button>
        <button id="tts-stop" class="icon-btn" title="Stop" aria-label="Stop playback"><svg class="icon"><use href="#i-stop"/></svg></button>
        <input id="tts-seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <span id="tts-time" class="hint">0:00 / 0:00</span>
        <span id="tts-voice" class="hint"></span>
      </div>
      <div id="attachments" hidden></div>
      <div id="prompt-menu" hidden role="listbox" aria-label="Prompt templates"></div>
      <div id="composer-tools">
        <button id="btn-attach" class="icon-btn" title="Attach images or files" aria-label="Attach files"><svg class="icon"><use href="#i-attach"/></svg></button>
        <button id="btn-draw" class="icon-btn" title="Generate an image" aria-label="Generate image"><svg class="icon"><use href="#i-wand"/></svg></button>
        <button id="btn-mic" class="icon-btn" title="Voice input" aria-label="Voice input"><svg class="icon"><use href="#i-mic"/></svg></button>
      </div>
      <input id="file-input" type="file" multiple hidden
             accept="image/png,image/jpeg,image/webp,image/gif,.txt,.md,.markdown,.csv,.json,.js,.py,.ts,.html,.css,.xml,.yaml,.yml,.log,.pdf">
      <textarea id="input" rows="1" placeholder="Type a message…  / for prompts" aria-label="Message"></textarea>
      <div id="composer-right">
        <span id="ctx-meter" class="hint" title="Context usage"></span>
        <button id="btn-fullscreen" class="icon-btn" title="Full-screen editor" aria-label="Full-screen editor"><svg class="icon"><use href="#i-maximize"/></svg></button>
        <button id="btn-send" class="primary icon-btn send"><svg class="icon"><use href="#i-send"/></svg><span>Send</span></button>
        <button id="btn-stop" class="danger icon-btn send" hidden><svg class="icon"><use href="#i-stop"/></svg><span>Stop</span></button>
      </div>
    </footer>
  </main>

  <!-- artifacts docked panel -->
  <aside id="artifacts" hidden role="dialog" aria-label="Artifacts">
    <div class="ar-head">
      <svg class="icon"><use href="#i-code"/></svg>
      <input id="ar-title" placeholder="Untitled artifact" aria-label="Artifact title">
      <span id="ar-ver" class="hint" title="Version"></span>
      <button id="ar-prev" class="icon-btn" title="Previous version" aria-label="Previous version"><svg class="icon"><use href="#i-chevron-left"/></svg></button>
      <button id="ar-next" class="icon-btn" title="Next version" aria-label="Next version"><svg class="icon"><use href="#i-chevron-right"/></svg></button>
      <button id="ar-close" class="icon-btn" title="Close" aria-label="Close artifacts"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <div class="ar-tabs" role="tablist">
      <button id="ar-tab-preview" class="on" role="tab" aria-selected="true">Preview</button>
      <button id="ar-tab-code" role="tab" aria-selected="false">Code</button>
      <button id="ar-tab-versions" role="tab" aria-selected="false">Versions</button>
    </div>
    <div id="ar-body">
      <iframe id="ar-frame" sandbox="allow-scripts" title="Artifact preview" hidden></iframe>
      <div id="ar-md" class="ar-md" hidden></div>
      <textarea id="ar-code" spellcheck="false" aria-label="Artifact source" hidden></textarea>
      <div id="ar-versions" class="ar-list" hidden></div>
      <div id="ar-list" class="ar-list" hidden></div>
      <div id="ar-empty" class="ar-empty hint" hidden>No artifacts yet — use the
        <strong>Artifact</strong> button on a code block in the chat.</div>
    </div>
    <div class="ar-rewrite">
      <div class="ar-chips">
        <button class="ar-chip" data-i="Make it noticeably shorter while preserving all behaviour and content.">Shorter</button>
        <button class="ar-chip" data-i="Make it richer and more detailed; keep the existing structure recognisable.">Longer</button>
        <button class="ar-chip" data-i="Find and fix bugs, invalid markup and accessibility problems without changing behaviour.">Fix bugs</button>
        <button class="ar-chip" data-i="Improve naming, formatting and readability without changing behaviour.">Polish</button>
      </div>
      <textarea id="ar-instruction" rows="2" placeholder="Tell the AI how to rewrite this… (or pick a chip)" aria-label="Rewrite instruction"></textarea>
      <div class="ar-actions">
        <button id="ar-rewrite" class="primary"><svg class="icon"><use href="#i-wand"/></svg><span>Rewrite</span></button>
        <button id="ar-save"><svg class="icon"><use href="#i-check"/></svg><span>Save version</span></button>
        <button id="ar-copy" class="icon-btn" title="Copy" aria-label="Copy artifact"><svg class="icon"><use href="#i-copy"/></svg></button>
        <button id="ar-download" class="icon-btn" title="Download" aria-label="Download artifact"><svg class="icon"><use href="#i-download"/></svg></button>
        <button id="ar-delete" class="icon-btn" title="Delete artifact" aria-label="Delete artifact"><svg class="icon"><use href="#i-trash"/></svg></button>
      </div>
    </div>
  </aside>
</div>

<!-- side chat floating panel -->
<div id="side-chat" hidden role="dialog" aria-label="Side chat">
  <div class="sc-head">
    <strong>Ask about this</strong>
    <select id="sc-model" aria-label="Side chat model"></select>
    <button id="sc-close" class="icon-btn" title="Close" aria-label="Close side chat"><svg class="icon"><use href="#i-x"/></svg></button>
  </div>
  <div class="sc-context hint"></div>
  <div id="sc-messages"></div>
  <div class="sc-row">
    <input id="sc-input" placeholder="Ask…">
    <button id="sc-send" class="primary">Ask</button>
  </div>
</div>

<div id="modal-back" hidden>
  <div id="modal" role="dialog" aria-modal="true"></div>
</div>
<div id="toasts" aria-live="polite"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
