[project]
name = "opentyper"
version = "0.2.0"
description = "Self-hosted bring-your-own-API-key chat UI for LLMs"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.121.1",
    "uvicorn==0.40.0",
    "httpx==0.28.1",
    "cryptography==46.0.5",
    "pydantic==2.12.5",
    "edge-tts==7.3.1",
    "pypdf>=6.21.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
